name: Scheduled evals

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval:ci
      - name: Upload eval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-eval-report
          path: reports/latest
          if-no-files-found: warn
          retention-days: 14
